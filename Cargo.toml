[package]
name = "Raspberry-Pi-Display"
version = "0.1.0"
description = "A TUI app for my Raspberry pi"
authors = ["Mihir Sahu"]
license = "MIT"
edition = "2024"

[dependencies]
color-eyre = "0.6.3"
crossterm = "0.29.0"
image = { version = "0.25.10", default-features = false, features = ["png"] }
ratatui = "0.30.0"
sysinfo = "0.39.3"

# Read the optimization guideline for more details: https://ratatui.rs/recipes/apps/release-your-app/#optimizations
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
